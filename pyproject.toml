[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flying-blue"
version = "0.0.5"
requires-python = ">=3.11"
dependencies = [
    "websockets>=15,<16"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6"
]

[tool.setuptools.packages.find]
where = ["src"]